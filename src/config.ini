[paths]
data_dir = data
save_dir = data/preprocessing

[features]
min_tag_freq = 1

[train]
min_playtime = 120
min_liked = 6
min_game_users = 20
n_candidates = 150
pick5_frac = 0.5
max_train_users = 0

[training]
# Metric used to select the best model: accuracy | precision | recall | f1 | roc_auc
selection_metric = roc_auc
# Customers with a churn probability >= this threshold are predicted to churn
decision_threshold = 0.5